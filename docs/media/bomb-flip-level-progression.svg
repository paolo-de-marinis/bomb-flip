  <rect x="630" y="412" width="90" height="28" rx="5" class="three"/><text x="675" y="431" text-anchor="middle" class="count">5</text>
  <text x="980" y="432" class="density">40.0%</text>

  <text x="66" y="471" class="level">L08</text><text x="125" y="471" class="small">5 × 5</text>
  <rect x="270" y="450" width="180" height="28" rx="5" class="bomb"/><text x="360" y="469" text-anchor="middle" class="count">10</text>
  <rect x="450" y="450" width="180" height="28" class="two"/><text x="540" y="469" text-anchor="middle" class="count">10</text>
  <rect x="630" y="450" width="90" height="28" rx="5" class="three"/><text x="675" y="469" text-anchor="middle" class="count">5</text>
  <text x="980" y="470" class="density">40.0%</text>

  <line x1="64" y1="495" x2="1136" y2="495" stroke="#ff9a4d" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="270" y="483" width="438" height="24" rx="12" fill="#0d1626"/>
  <text x="489" y="500" text-anchor="middle" fill="#ffb06f" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700">LEVEL 9 · 6 × 6 RESET · +11 CELLS</text>

  <!-- Levels 9-12: 6 × 6, 36 cells -->
  <text x="66" y="539" class="level">L09</text><text x="125" y="539" class="small">6 × 6</text>
  <rect x="270" y="518" width="234" height="28" rx="5" class="bomb"/><text x="387" y="537" text-anchor="middle" class="count">13</text>
  <rect x="504" y="518" width="234" height="28" class="one"/><text x="621" y="537" text-anchor="middle" class="count">13</text>
  <rect x="738" y="518" width="126" height="28" class="two"/><text x="801" y="537" text-anchor="middle" class="count">7</text>
  <rect x="864" y="518" width="54" height="28" rx="5" class="three"/><text x="891" y="537" text-anchor="middle" class="count">3</text>
