  <text x="66" y="577" class="level">L10</text><text x="125" y="577" class="small">6 × 6</text>
  <rect x="270" y="556" width="252" height="28" rx="5" class="bomb"/><text x="396" y="575" text-anchor="middle" class="count">14</text>
