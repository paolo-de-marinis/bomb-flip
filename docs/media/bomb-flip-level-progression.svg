  <text x="980" y="652" class="density">44.4%</text>

  <text x="64" y="694" class="small">Level 9 expands the constraint geometry while density dips 40.0% → 36.1%; levels 10–12 then increase bombs within the 6 × 6 board.</text>
</svg>
