<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Bomb Flip level composition progression</title>
  <desc id="desc">Stacked bars show the exact bomb, times-one, times-two and times-three card counts for all twelve Bomb Flip levels. Levels one through eight have twenty-five cells. Level nine expands to thirty-six cells and temporarily lowers bomb density before it increases through level twelve.</desc>
  <style>
    .label { fill: #8fa7bd; font: 600 14px "DejaVu Sans", sans-serif; letter-spacing: 1px; }
    .small { fill: #9eb1c5; font: 14px "DejaVu Sans", sans-serif; }
    .level { fill: #eaf4ff; font: 700 16px "DejaVu Sans Mono", monospace; }
    .density { fill: #eaf4ff; font: 600 15px "DejaVu Sans Mono", monospace; }
    .count { fill: #07101c; font: 700 13px "DejaVu Sans Mono", monospace; }
    .bomb { fill: #ff5b72; }
    .one { fill: #8fcce8; }
    .two { fill: #ffe45b; }
    .three { fill: #ff9a4d; }
  </style>
  <rect width="1200" height="740" fill="#090f1c"/>
  <rect x="24" y="24" width="1152" height="692" rx="24" fill="#0d1626" stroke="#263a53" stroke-width="2"/>

  <text x="64" y="74" fill="#ff9a4d" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">BOMB FLIP · LEVEL COMPOSITION</text>
  <text x="64" y="110" fill="#f3f8ff" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Fixed card counts across the twelve-level run</text>

  <rect x="65" y="126" width="16" height="16" rx="3" class="bomb"/><text x="90" y="140" class="small">bomb</text>
  <rect x="155" y="126" width="16" height="16" rx="3" class="one"/><text x="180" y="140" class="small">×1</text>
  <rect x="230" y="126" width="16" height="16" rx="3" class="two"/><text x="255" y="140" class="small">×2</text>
  <rect x="305" y="126" width="16" height="16" rx="3" class="three"/><text x="330" y="140" class="small">×3</text>
  <text x="270" y="171" class="label">BAR LENGTH = CELL COUNT</text>
  <text x="965" y="171" class="label">BOMB DENSITY</text>

  <!-- Levels 1-8: 5 × 5, 25 cells -->
  <text x="66" y="205" class="level">L01</text><text x="125" y="205" class="small">5 × 5</text>
  <rect x="270" y="184" width="108" height="28" rx="5" class="bomb"/><text x="324" y="203" text-anchor="middle" class="count">6</text>
  <rect x="378" y="184" width="270" height="28" class="one"/><text x="513" y="203" text-anchor="middle" class="count">15</text>
  <rect x="648" y="184" width="54" height="28" class="two"/><text x="675" y="203" text-anchor="middle" class="count">3</text>
  <rect x="702" y="184" width="18" height="28" rx="5" class="three"/>
  <text x="980" y="204" class="density">24.0%</text>

  <text x="66" y="243" class="level">L02</text><text x="125" y="243" class="small">5 × 5</text>
  <rect x="270" y="222" width="126" height="28" rx="5" class="bomb"/><text x="333" y="241" text-anchor="middle" class="count">7</text>
  <rect x="396" y="222" width="216" height="28" class="one"/><text x="504" y="241" text-anchor="middle" class="count">12</text>
