  <rect x="270" y="336" width="180" height="28" rx="5" class="bomb"/><text x="360" y="355" text-anchor="middle" class="count">10</text>
  <rect x="450" y="336" width="72" height="28" class="one"/><text x="486" y="355" text-anchor="middle" class="count">4</text>
  <rect x="522" y="336" width="126" height="28" class="two"/><text x="585" y="355" text-anchor="middle" class="count">7</text>
